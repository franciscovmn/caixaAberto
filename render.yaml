# Blueprint do Render: banco, API e frontend.
#
# CORS_ORIGIN e VITE_API_URL ficam com sync: false porque uma depende da URL da outra, e nenhuma das
# duas existe antes do primeiro deploy. O Render pergunta os dois valores na criacao do blueprint;
# se as URLs ainda nao forem conhecidas, basta deixar qualquer valor e corrigir depois no painel,
# conforme o passo a passo do README.

databases:
  - name: caixa-aberto-db
    databaseName: caixa_aberto
    user: caixa_aberto
    plan: free

services:
  - type: web
    name: caixa-aberto-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caixa-aberto-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Sem disco persistente no plano gratuito, os comprovantes vao para o proprio Postgres.
      - key: STORAGE_DRIVER
        value: database
      - key: UPLOAD_MAX_BYTES
        value: 5242880
      # A URL do site estatico, com https e sem barra no final.
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: caixa-aberto-web
    runtime: static
    # O Render instala as dependencias em um passo proprio, antes do buildCommand, entao aqui nao
    # cabe "npm ci". Esse passo dispara o postinstall do backend, que roda prisma generate, e por
    # isso a DATABASE_URL de fachada precisa ser variavel de ambiente do servico, abaixo, e nao
    # prefixo deste comando: um prefixo so valeria para o comando, e a instalacao ja teria falhado.
    buildCommand: npm run build -w frontend
    staticPublishPath: ./frontend/dist
    # A regra de rewrite que manda todo caminho para o index.html NAO esta aqui, e precisa ser criada
    # a mao no painel, em Redirects/Rewrites. O motivo e um defeito do lado do Render: o servidor
    # recusa o blueprint com "services[1].routes is not allowed", embora `routes` seja documentado
    # para site estatico e este arquivo valide sem erro contra o schema publicado em
    # https://render.com/schema/render.yaml.json. O painel aceita a mesma regra sem reclamar, e o
    # Render preserva regras de roteamento que nao estao no blueprint, entao ela sobrevive aos
    # deploys seguintes. Quando o validador deles for corrigido, basta devolver o bloco:
    #
    #   routes:
    #     - type: rewrite
    #       source: /*
    #       destination: /index.html
    #
    # O passo manual esta no README, em Publicacao.
    envVars:
      # A URL da API, com https e sem barra no final. Lida no momento do build pelo Vite.
      - key: VITE_API_URL
        sync: false
      # Fachada, exigida pelo prisma generate que o postinstall do backend roda na instalacao. Nenhuma
      # conexao e aberta com ela: o generate so le o schema. O frontend nao fala com banco nenhum.
      - key: DATABASE_URL
        value: postgresql://build:build@localhost:5432/build
